{% extends "base.html" %}
{% load static %}
{% block title %}Пароль изменён — Floréa{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}" />{% endblock %}

{% block content %}
<main class="auth-main">
  <div class="auth-deco auth-deco--left">🌸</div>
  <div class="auth-deco auth-deco--right">🌿</div>
  <div class="auth-card" style="text-align:center;">
    <div style="font-size:56px;margin-bottom:16px;">✅</div>
    <h1 style="font-size:22px;margin-bottom:8px;">Пароль изменён</h1>
    <p style="font-family:sans-serif;font-size:14px;color:var(--gray);margin-bottom:24px;">
      Ваш пароль успешно обновлён. Теперь вы можете войти с новым паролем.
    </p>
    <a href="{% url 'auth' %}" class="btn-auth" style="text-decoration:none;display:block;">Войти в аккаунт</a>
  </div>
</main>
{% endblock %}

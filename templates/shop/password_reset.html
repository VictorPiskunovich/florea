{% extends "base.html" %}
{% load static %}
{% block title %}Восстановление пароля — Floréa{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}" />{% endblock %}

{% block content %}
<main class="auth-main">
  <div class="auth-deco auth-deco--left">🌸</div>
  <div class="auth-deco auth-deco--right">🌿</div>
  <div class="auth-card">
    <div class="auth-brand">
      <a href="{% url 'index' %}" style="text-decoration:none;display:flex;align-items:center;gap:8px;">
        <span class="auth-brand-icon">🌺</span>
        <span class="auth-brand-name">Floréa</span>
      </a>
    </div>

    <div class="auth-welcome">
      <h1>Забыли пароль?</h1>
      <p>Введите email — мы пришлём ссылку для сброса</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" name="email" placeholder="ivan@mail.ru" required autofocus />
        </div>
      </div>
      <button type="submit" class="btn-auth">Отправить ссылку</button>
    </form>

    <p class="auth-switch">
      Вспомнили пароль?
      <a href="{% url 'auth' %}" class="auth-switch-btn" style="text-decoration:none;">Войти</a>
    </p>
  </div>
</main>
{% endblock %}
